services:
  openchamber:
    build:
      context: .
      args:
        OPENCHAMBER_VERSION: "${OPENCHAMBER_VERSION:-2.7.1}"
        OPENCODE_VERSION: "${OPENCODE_VERSION:-2.3.0}"
        TTYD_VERSION: "${TTYD_VERSION:-1.7.7}"
        PLAYWRIGHT_VERSION: "${PLAYWRIGHT_VERSION:-1.65.0}"
    image: "${IMAGE_NAME:-ghcr.io/sbonnick/openchamber-docker}:latest"

  openchamber-ubuntu:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
      args:
        OPENCHAMBER_VERSION: "${OPENCHAMBER_VERSION:-2.7.1}"
        OPENCODE_VERSION: "${OPENCODE_VERSION:-2.3.0}"
        TTYD_VERSION: "${TTYD_VERSION:-1.7.7}"
        PLAYWRIGHT_VERSION: "${PLAYWRIGHT_VERSION:-1.65.0}"
    image: "${IMAGE_NAME:-ghcr.io/sbonnick/openchamber-docker}:ubuntu"
